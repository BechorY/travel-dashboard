      <label class="filter-item"><input type="checkbox" id="chkSun" checked> Sun</label>
      <label class="filter-item"><input type="time" id="tFrom" value="04:00"><span>&#8211;</span><input type="time" id="tTo" value="08:00"></label>
      <label class="filter-item"><input type="checkbox" id="chkSat" checked> Sat night from</label>
      <label class="filter-item"><input type="time" id="satFrom" value="19:00"></label>

</div>
<div class="main">
  <div class="daily-wrap">

  <div class="ldwrap" id="ldwrap"><div class="spin"></div><div class="lmsg" id="lmsg">Searching deals&#8230;</div><div class="lsub" id="lsub">Checking Booking.com &amp; Kiwi</div></div>
  <div class="res" id="res">
    <div class="reshdr"><div><h2 id="rtitle">Results</h2><div class="rmeta" id="rmeta"></div></div><span class="cpill" id="rcnt"></span></div>

      <div class="cmpbar">&#8505;&#65039; Hotels from <strong style="margin-left:3px;">Booking.com</strong>.</div>
      <div class="sortbar"><span>Sort:</span><button class="sc on" onclick="sortHot('price',this)">&#128176; Price</button><button class="sc" onclick="sortHot('score',this)">&#11088; Rating</button></div>
      <div id="hotCards" class="cards"></div>
    </div>

<button class="backsearch" id="backSearchBtn" onclick="backToSearch()" aria-label="Back to search">&#128269; Back to Search</button>
<script>
// Deals live in deals.json (written by the daily cloud Routine) and are
// fetched at runtime so the page never needs editing to refresh data.
let DAILY_DEALS=null;
const STALE_AFTER_HOURS=16*24;   // refresh runs every 2 weeks + 2 days grace
const RELOAD_AFTER_MS=30*60*1000;   // refetch when the app is reopened after this long
var dealsLoadFailed=false, dealsLoadedAt=0;
// A week's flights can leave on the Saturday night before its Sunday, so it
// stays listed until that Saturday has passed.
function upcomingWeeks(){
  if(!DAILY_DEALS||!DAILY_DEALS.weeks)return[];
  var today=isoDate(new Date());
  return DAILY_DEALS.weeks.filter(function(w){return !w.departure||addDays(w.departure,-1)>=today;});
}
function ageLabel(hours){
  if(hours<1)return'just now';
  if(hours<24)return Math.floor(hours)+'h ago';
  var days=Math.floor(hours/24);
  return days+' day'+(days===1?'':'s')+' ago';
}
async function loadDeals(){
  try{
    var r=await fetch('deals.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    DAILY_DEALS=await r.json();
    dealsLoadFailed=false;dealsLoadedAt=Date.now();
  }catch(e){
    console.error('deals.json load failed',e);
    // Keep showing previously loaded deals rather than blanking the page.
    if(DAILY_DEALS===null)dealsLoadFailed=true;
  }
  fillDestinationSelect();
  if(!S.applied&&!S.seasonPicked){
    // First load: default filters = loaded season, all destinations, package, couple.
    setSeason(DAILY_DEALS&&DAILY_DEALS.season==='winter'?'winter':'summer',true);
    if(!hasLiveBridge())S.applied=readUiFilters();
  }
  renderDailyDeals();
}
const S={season:'summer',mode:'package',paxMode:'couple',adults:2,children:0,childAges:[],flights:[],hotels:[],fSort:'price',hSort:'price',activeTab:'Pkg',activeWeek:0,last:null};
// Season windows were hard-coded to fixed 2026 dates, so once a season passed
// the picker handed the search dates in the past. Compute them from today.
function isoDate(d){
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function addDays(iso,n){var d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return isoDate(d);}
function seasonWindow(s,today){
  var y=today.getFullYear();
  // January still belongs to the winter that began the previous November.
  if(s==='winter'&&today.getMonth()===0)y-=1;
  var w = s==='summer'
    ? {start:new Date(y,5,1),  end:new Date(y,7,31)}      // 1 Jun – 31 Aug
    : {start:new Date(y,10,1), end:new Date(y+1,0,31)};   // 1 Nov – 31 Jan
  if(w.end<today){                                        // window already closed → next year
    w = s==='summer'
      ? {start:new Date(y+1,5,1),  end:new Date(y+1,7,31)}
      : {start:new Date(y+1,10,1), end:new Date(y+2,0,31)};
  }
  return w;
}
function seasonDates(s){
  var today=new Date(); today.setHours(0,0,0,0);
  var w=seasonWindow(s,today);
  var d=new Date(w.start<today?today:w.start);
  while(d.getDay()!==0)d.setDate(d.getDate()+1);          // first Sunday in window
  if(d>w.end){d=new Date(w.start);while(d.getDay()!==0)d.setDate(d.getDate()+1);}
  var ret=new Date(d);ret.setDate(ret.getDate()+7);
  return {from:isoDate(d),to:isoDate(ret)};
}
const SD={get summer(){return seasonDates('summer');},get winter(){return seasonDates('winter');}};
var searchOpen=false;
function toggleSearch(){searchOpen=!searchOpen;var b=document.getElementById('spanelBody');var ico=document.getElementById('stoggleIco');if(searchOpen){b.classList.remove('collapsed');ico.textContent='▲';}else{b.classList.add('collapsed');ico.textContent='▼';}}

function setWeek(i){S.activeWeek=i;renderDailyDeals();}

// ── Back to Search ────────────────────────────────────────────────
// Scrolls to the top and makes sure the search panel is actually open.
// On mobile the panel starts collapsed behind a toggle, so expand it first.
function backToSearch(){
  var body=document.getElementById('spanelBody');
  var isMobile=window.matchMedia('(max-width:599px)').matches;
  if(isMobile&&body&&body.classList.contains('collapsed')){toggleSearch();}
  scrollToTop();
  setTimeout(function(){
    var d=document.getElementById('dest');
    // Focus the destination field on desktop only — focusing on mobile pops
    // the keyboard up over the panel the user just asked to see.
    if(d&&!isMobile){try{d.focus({preventScroll:true});}catch(e){d.focus();}}
  },450);
}
// Some engines (and some embedded webviews) silently ignore behavior:'smooth'
// and simply do nothing, which would leave the button dead. Try smooth, then
// hard-jump if we haven't actually moved.
function scrollToTop(){
  var start=window.scrollY;
  try{window.scrollTo({top:0,left:0,behavior:'smooth'});}catch(e){}
  setTimeout(function(){
    if(window.scrollY>0&&window.scrollY>=start)window.scrollTo(0,0);
  },600);
}
function updateBackSearchBtn(){
  var btn=document.getElementById('backSearchBtn');
  if(!btn)return;
  if(window.scrollY>240)btn.classList.add('vis');else btn.classList.remove('vis');
}
window.addEventListener('scroll',updateBackSearchBtn,{passive:true});
window.addEventListener('resize',updateBackSearchBtn,{passive:true});

// ── Pre-loaded deals: filters applied on "Search Deals" ───────────
// S.applied holds the filters from the last Search press (or the defaults),
// so changing a control does nothing until the user presses Search.
const BEST_WEEKS=3;          // weeks shown as "Best Deals"; the rest go to "More weeks"
const PAX_COUNT={couple:2,family:6};
const TYPE_LABEL={beach:'🏖️ Beach',city:'🏙️ City',exotic:'🌴 Exotic'};
const TYPE_CLASS={beach:'t-beach',city:'t-city',exotic:'t-exotic'};
const MODE_LABEL={package:'Package',flights:'Flights only',hotels:'Hotels only'};
function readUiFilters(){
  var sel=document.getElementById('destSel');
  return {season:S.season,dest:sel?sel.value:'',mode:S.mode,pax:S.paxMode,
    from:document.getElementById('dateFrom').value,to:document.getElementById('dateTo').value};
}
// Couple prices are the destination's own fields; family prices live in d.family.
function offerFor(d,pax){
  if(pax==='family')return d.family||null;
  return {flight:d.flight,hotel:d.hotel,totalUSD:d.totalUSD,perPersonUSD:d.perPersonUSD};
}
function modePrice(o,mode){
  if(mode==='flights')return o.flight?o.flight.price:null;
  if(mode==='hotels')return o.hotel?o.hotel.priceUSD:null;
  return o.totalUSD;
}
// → {rows:[{d,o,price}], missingFamily:[dest names]} for one week under filters f.
function weekRows(week,f){
  var rows=[],missingFamily=[];
  (week.destinations||[]).forEach(function(d){
    if(f.dest&&d.dest!==f.dest)return;
    var o=offerFor(d,f.pax);
    if(!o){missingFamily.push(d.dest);return;}
    var price=modePrice(o,f.mode);
    if(price==null)return;
    rows.push({d:d,o:o,price:price});
  });
  rows.sort(function(a,b){return a.price-b.price;});
  return {rows:rows,missingFamily:missingFamily};
}
function filteredWeeks(f){
  var weeks=upcomingWeeks();
  if(f.season==='custom'){
    weeks=weeks.filter(function(w){return(!f.from||w.departure>=f.from)&&(!f.to||w.departure<=f.to);});
  }
  return weeks;
}
function stopsLabel(fl){return fl.stops===0?'Direct':fl.stops===1?'1 stop via '+fl.stopCity:fl.stops+' stops via '+fl.stopCity;}
function flightSeg(d,fl,showPrice){
  return '<div class="deal-seg"><div class="deal-seg-lbl">✈️ Flight · '+stopsLabel(fl)+'</div>'
    +'<div class="deal-seg-row"><span class="deal-time">'+(fl.departsLocal?fl.departsLocal.substring(11,16):'—')+'</span>'
    +'<span class="deal-route">TLV → '+d.dest+' · '+(fl.durationSec?fdur(fl.durationSec):'')+'<br>'+fdt(fl.departsLocal)+' → returns '+fdt(fl.returnDeparts)+'</span>'
    +(showPrice?'<span class="deal-seg-price">$'+fl.price.toLocaleString()+'</span>':'')+'</div></div>';
}
function hotelSeg(h,showPrice){
  var rooms=h.rooms&&h.rooms>1?' · '+h.rooms+' rooms':'';
  return '<div class="deal-hotel"><div><div class="deal-hotel-name">🏨 '+h.name+'</div><div class="deal-hotel-meta"><div class="rev-pill"><span class="rscore">'+h.score.toFixed(1)+'</span>&nbsp;'+slbl(h.score)+' · '+h.nights+' nights'+rooms+'</div></div></div>'
    +(showPrice?'<div class="deal-hotel-price">$'+h.priceUSD.toLocaleString()+'</div>':'')+'</div>';
}
function dealCard(row,f,top){
  var d=row.d,o=row.o,fl=o.flight,h=o.hotel,pkg=f.mode==='package';
  var pp=Math.round(row.price/PAX_COUNT[f.pax]);
  var body=[];
  if(f.mode!=='hotels')body.push(flightSeg(d,fl,pkg));
  if(f.mode!=='flights'&&h)body.push(hotelSeg(h,pkg));
  var cta=(f.mode!=='hotels'&&fl.link?'<a class="cta-btn cta-pri" href="'+fl.link+'" target="_blank" rel="noopener">✈️ Book Flight</a>':'')
         +(f.mode!=='flights'&&h&&h.link?'<a class="cta-btn '+(f.mode==='hotels'?'cta-pri':'cta-sec')+'" href="'+h.link+'" target="_blank" rel="noopener">🏨 Book Hotel</a>':'');
  return '<div class="deal-card'+(top?' top-deal':'')+'">'
    +'<div class="deal-card-hdr"><div><div style="display:flex;align-items:center;gap:8px;"><span style="font-size:22px;">'+d.flag+'</span><div class="dest-name">'+d.dest+'</div></div><span class="type-badge '+TYPE_CLASS[d.type]+'">'+TYPE_LABEL[d.type]+'</span></div>'
    +'<div class="deal-price-blk"><div class="deal-total">$'+row.price.toLocaleString()+'</div><div class="deal-pp">≈ $'+pp.toLocaleString()+'/person</div></div></div>'
    +body.map(function(s){return'<div class="deal-divider"></div>'+s;}).join('')
    +'<div class="deal-cta">'+cta+'</div></div>';
}
function weekGrid(wr,f){
  if(!wr.rows.length){
    var why=wr.missingFamily.length&&f.pax==='family'
      ?'<h3>Family prices not in this refresh</h3><p>Family (6) prices are added from the next refresh.</p>'
      :'<h3>No deals match these filters</h3><p>Try “All destinations” or another option.</p>';
    return '<div class="daily-empty"><div class="ico">🔍</div>'+why+'</div>';
  }
  var note=wr.missingFamily.length?'<div class="filter-summary">Family prices not available for: '+wr.missingFamily.join(', ')+'</div>':'';
  return note+'<div class="deals-grid">'+wr.rows.map(function(r,i){return dealCard(r,f,i===0);}).join('')+'</div>';
}
function filterSummary(f){
  var season=f.season==='custom'?('Custom '+(f.from?fdt(f.from):'…')+' – '+(f.to?fdt(f.to):'…')):(f.season==='winter'?'Winter':'Summer');
  return season+' · '+(f.dest||'All destinations')+' · '+MODE_LABEL[f.mode]+' · '+(f.pax==='family'?'Family (6)':'Couple (2)');
}
function destinationNames(){
  var seen={};
  upcomingWeeks().forEach(function(w){(w.destinations||[]).forEach(function(d){seen[d.dest]=true;});});
  return Object.keys(seen).sort();
}
function fillDestinationSelect(){
  var sel=document.getElementById('destSel');if(!sel)return;
  var cur=sel.value;
  sel.innerHTML='<option value="">All destinations</option>'+destinationNames().map(function(n){return'<option'+(n===cur?' selected':'')+'>'+n+'</option>';}).join('');
}

function renderDailyDeals(){
  var area=document.getElementById('dailyDealsArea');
  var tabArea=document.getElementById('weekTabsArea');
  var more=document.getElementById('moreWeeksArea');
  var dot=document.getElementById('statusDot');
  var upd=document.getElementById('updAt');
  var hd=document.getElementById('dealsHeading');
  var summary=document.getElementById('filterSummary');
  more.innerHTML='';summary.textContent='';
  if(DAILY_DEALS===null){dot.className='status-dot '+(dealsLoadFailed?'stale':'none');upd.textContent=dealsLoadFailed?'Couldn’t load deals — pull down to refresh':'Loading…';tabArea.innerHTML='';area.innerHTML='';return;}
  var f=S.applied||readUiFilters();
  summary.textContent=filterSummary(f);
  var updTime=new Date(DAILY_DEALS.updatedAt);
  var ageh=(Date.now()-updTime)/3600000;
  var stale=ageh>STALE_AFTER_HOURS;
  var updLabel=updTime.toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  dot.className='status-dot'+(stale?' stale':'');
  upd.textContent='Updated '+updLabel+' · '+ageLabel(ageh);
  var banner=stale?'<div class="stale-banner">⚠️ Refresh hasn’t run since '+updLabel+' — prices may have changed.</div>':'';
  // The data holds one season; picking the other one explains when it arrives.
  if(f.season!=='custom'&&DAILY_DEALS.season!==f.season){
    var today=new Date();today.setHours(0,0,0,0);
    var from=seasonWindow(DAILY_DEALS.season,today).end;from=new Date(from);from.setDate(from.getDate()+1);
    var name=f.season==='winter'?'Winter':'Summer';
    hd.innerHTML='🔥 Best Deals';tabArea.innerHTML='';
    area.innerHTML='<div class="daily-empty"><div class="ico">'+(f.season==='winter'?'❄️':'☀️')+'</div><h3>'+name+' deals not loaded yet</h3><p>The app loads one season at a time. '+name+' deals are loaded from '+fdt(isoDate(from))+', when the current season ends.</p></div>';
    return;
  }
  var weeks=filteredWeeks(f);
  var best=weeks.slice(0,BEST_WEEKS), later=weeks.slice(BEST_WEEKS);
  hd.innerHTML='🔥 Best Deals — '+best.length+' Week'+(best.length===1?'':'s');
  if(!best.length){
    tabArea.innerHTML='';
    var msg=f.season==='custom'?'<h3>No loaded weeks in these dates</h3><p>Loaded weeks: '+upcomingWeeks().map(function(w){return w.label;}).join(', ')+'.</p>'
                               :'<h3>All loaded trips have departed</h3><p>New deals appear after the next refresh.</p>';
    area.innerHTML=banner+'<div class="daily-empty"><div class="ico">🗓️</div>'+msg+'</div>';return;
  }
  if(S.activeWeek>=best.length)S.activeWeek=0;
  var bestRows=best.map(function(w){return weekRows(w,f);});
  tabArea.innerHTML='<div class="week-tabs">'+best.map(function(w,i){
    var low=bestRows[i].rows.length?bestRows[i].rows[0].price:null;
    return'<button class="wtab'+(i===S.activeWeek?' on':'')+'" onclick="setWeek('+i+')"><span class="wlabel">'+w.label+'</span>'+(low?'<span class="wprice">from $'+low.toLocaleString()+'</span>':'')+'</button>';
  }).join('')+'</div>';
  area.innerHTML=banner+weekGrid(bestRows[S.activeWeek],f);
  if(later.length){
    more.innerHTML='<div class="section-hdr" style="margin-top:22px;"><h2>📅 More weeks</h2></div>'
      +later.map(function(w){return'<h3 class="more-week-lbl">'+w.label+'</h3>'+weekGrid(weekRows(w,f),f);}).join('');
  }
}

var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function seasonChipLabels(){
  var today=new Date();today.setHours(0,0,0,0);
  var su=seasonWindow('summer',today), wi=seasonWindow('winter',today);
  var fmt=function(d){return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();};
  document.querySelector('[data-s="summer"]').textContent='☀️ Summer 1 Jun – '+fmt(su.end);
  document.querySelector('[data-s="winter"]').textContent='❄️ Winter '+fmt(wi.start)+' – '+fmt(wi.end);
}
function setSeason(s,auto){
  if(!auto)S.seasonPicked=true;S.season=s;
  document.querySelectorAll('.schip').forEach(c=>c.classList.remove('on'));document.querySelector('[data-s="'+s+'"]').classList.add('on');
  if(hasLiveBridge()){
    if(s!=='custom'){document.getElementById('dateFrom').value=SD[s]?SD[s].from:'';document.getElementById('dateTo').value=SD[s]?SD[s].to:'';}
    renderDailyDeals();return;
  }
  // Pre-loaded deals: the choice takes effect on "Search Deals".
  showCustomDates(s==='custom');
  if(s==='custom'){
    var weeks=upcomingWeeks(),df=document.getElementById('dateFrom'),dt=document.getElementById('dateTo');
    if(!df.value&&weeks.length)df.value=weeks[0].departure;
    if(!dt.value&&weeks.length)dt.value=weeks[weeks.length-1].departure;
  }
}
// Custom Dates on the public page = a From/To range over the loaded weeks.
function showCustomDates(show){
  [['dateFrom','From (Sunday)'],['dateTo','To (Sunday)']].forEach(function(p){
    var el=document.getElementById(p[0]);if(!el||!el.parentElement)return;
    el.parentElement.style.display=show?'':'none';
    var lbl=el.parentElement.querySelector('label');if(lbl)lbl.textContent=p[1];
  });
}
function setMode(m){S.mode=m;document.querySelectorAll('[data-m]').forEach(b=>b.classList.remove('on'));document.querySelector('[data-m="'+m+'"]').classList.add('on');}
function setPax(p){S.paxMode=p;document.querySelectorAll('[data-p]').forEach(b=>b.classList.remove('on'));document.querySelector('[data-p="'+p+'"]').classList.add('on');S.adults=p==='couple'?2:4;S.children=p==='couple'?0:2;}
function showTab(t){S.activeTab=t;['Pkg','Fly','Hot'].forEach(function(id){document.getElementById('t'+id).classList.remove('on');document.getElementById('p'+id).classList.remove('on');});document.getElementById('t'+t).classList.add('on');document.getElementById('p'+t).classList.add('on');}
function ftm(s){return s?s.substring(11,16):'—';}
function fdt(s){if(!s)return'';var d=new Date(s.length===10?s+'T00:00:00':s);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function fdur(s){var h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h+'h'+(m?' '+m+'m':'');}
function nts(f,t){if(!f||!t)return 7;return Math.round((new Date(t)-new Date(f))/86400000);}
function stars(n){return'★'.repeat(n||0)+'☆'.repeat(Math.max(0,5-(n||0)));}
function slbl(s){if(s>=9.2)return'Exceptional';if(s>=8.5)return'Excellent';if(s>=8)return'Very Good';if(s>=7)return'Good';return'Okay';}
function totPax(){return S.paxMode==='couple'?2:S.adults+S.children;}
function getStops(f){return f.layovers?f.layovers.length:0;}
function dmy(s){return s?s.split('-').reverse().join('/'):'';}
var KFACS=['Free WiFi','Swimming pool','Outdoor pool','Indoor pool','Restaurant','Spa','Fitness','Free parking','Breakfast','Air conditioning','Beach','Bar'];
function kfac(arr){if(!arr)return[];return arr.filter(function(f){return KFACS.some(function(k){return f.toLowerCase().indexOf(k.toLowerCase())>=0;});}).slice(0,5);}
function isSunday(s){return new Date(s+'T00:00:00').getDay()===0;}
function inTimeRange(local){if(!local)return true;var t=local.substring(11,16),tF=document.getElementById('tFrom').value||'04:00',tT=document.getElementById('tTo').value||'08:00';return t>=tF&&t<=tT;}
function meetsMinDays(from,to){var mn=parseInt(document.getElementById('minDays').value)||4;return nts(from,to)>=mn;}
function setld(m,s){document.getElementById('lmsg').textContent=m;document.getElementById('lsub').textContent=s;}
// Must use local date parts, not toISOString(): the Date is local midnight, so
// in any timezone east of UTC (Israel = UTC+2/+3) toISOString() rolls back to
// the previous day — which turned every Sunday search into a Saturday one and
// then failed the Sunday filter, yielding zero flights.
function nextSundayInWindow(from){var d=new Date(from+'T00:00:00');while(d.getDay()!==0)d.setDate(d.getDate()+1);return isoDate(d);}

// ── Live vs offline ───────────────────────────────────────────────
// window.cowork only exists inside the Claude desktop artifact. On GitHub
// Pages it is undefined, so live Kiwi/Booking calls are impossible. Rather
// than throwing (which used to surface as a misleading "No flights found"),
// fall back to filtering the deals baked into DAILY_DEALS by the daily task.
function hasLiveBridge(){
  return !!(window.cowork && typeof window.cowork.callMcpTool==='function');
}
async function doSearch(){
  var dest=document.getElementById('dest').value.trim(),from=document.getElementById('dateFrom').value,to=document.getElementById('dateTo').value,de=document.getElementById('dest');
  // Offline (GitHub Pages): filter the baked-in deals instead of calling MCP.
  if(!hasLiveBridge()){
    document.getElementById('ldwrap').classList.remove('vis');
    await loadDeals();   // pick up a newer deals.json if one was published
    S.applied=readUiFilters();S.activeWeek=0;
    renderDailyDeals();
    document.querySelector('.daily-wrap').scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  if(!dest){de.classList.add('err');de.focus();setTimeout(function(){de.classList.remove('err');},2500);return;}
  if(!from||!to){alert('Please choose departure and return dates.');return;}
  if(from>=to){alert('Return date must be after departure date.');return;}
  // Saturday-night departures belong to the same weekend as the Sunday, so when
  // that window is enabled we widen the API request back one day and let
  // applyFilters() decide. Without this the Saturday flights are never fetched.
  var wantSun=chk('chkSun',true), wantSat=chk('chkSat',false);
  var searchFrom=from, depTo=null;
  if(wantSun||wantSat){
    var sun=nextSundayInWindow(from);
    if(sun>to){alert('No Sunday found in date range.');return;}
    var sat=addDays(sun,-1);
    searchFrom = wantSat?sat:sun;
    depTo      = wantSun?sun:sat;
  }
  S.last={dest,from:searchFrom,to};S.flights=[];S.hotels=[];
  document.getElementById('res').classList.remove('vis');document.getElementById('ldwrap').classList.add('vis');document.getElementById('sbtn').disabled=true;
  setld('🔍 Searching '+dest+'…',fdt(searchFrom)+' – '+fdt(to)+' · '+totPax()+' travellers');
  try{
    var tasks=[];
    if(S.mode!=='hotels')tasks.push(callFlights(dest,searchFrom,to,depTo));
    if(S.mode!=='flights')tasks.push(callHotels(dest,searchFrom,to));
    var rs=await Promise.allSettled(tasks);
    rs.forEach(function(r){if(r.status==='fulfilled'&&r.value){if(r.value.type==='flights')S.flights=r.value.data;if(r.value.type==='hotels')S.hotels=r.value.data;}});
  }catch(e){console.error(e);}
  document.getElementById('ldwrap').classList.remove('vis');document.getElementById('sbtn').disabled=false;
  renderAll();
}
// Two accepted departure windows:
//   Sunday   04:00–08:00  (early-morning start to the week)
//   Saturday from 19:00   (Motzaei Shabbat — after Shabbat ends)
// A flight qualifies if it falls in EITHER enabled window. With both boxes
// unchecked there is no day/time restriction at all.
function val(id,dflt){var el=document.getElementById(id);return(el&&el.value)?el.value:dflt;}
function chk(id,dflt){var el=document.getElementById(id);return el?el.checked:dflt;}
function dayTimeOK(local){
  if(!local)return false;
  var dow=new Date(local.substring(0,10)+'T00:00:00').getDay(); // 0=Sun … 6=Sat
  var t=local.substring(11,16);
  var sunOn=chk('chkSun',true), satOn=chk('chkSat',false);
  if(!sunOn&&!satOn)return true;
  if(sunOn&&dow===0&&t>=val('tFrom','04:00')&&t<=val('tTo','08:00'))return true;
  if(satOn&&dow===6&&t>=val('satFrom','19:00'))return true;
  return false;
}
function applyFilters(list){
  return list.filter(function(f){
    var dep=f.departure&&f.departure.local?f.departure.local:'';
    if(!dayTimeOK(dep))return false;
    var ret=f['return']&&f['return'].arrival&&f['return'].arrival.local?f['return'].arrival.local.substring(0,10):'';
    return meetsMinDays(dep.substring(0,10),ret);
  });
}
// The Kiwi tool returns {itineraries:[{price,outbound,inbound,bookingUrl,...}]}
// but the renderers below expect a flatter legacy shape (departure.local,
// layovers, deepLink, ...). Previously the code did Array.isArray(raw)?raw:[],
// which is always false for that object — so every search silently produced
// zero flights. Normalise here so the consumers keep working unchanged.
function normalizeItinerary(it){
  var ob=it.outbound||{}, ib=it.inbound||null, segs=ob.segments||[];
  return {
    price: it.price,
    priceFormatted: it.priceFormatted,
    departure:{local: ob.departureTime},
    arrival:{local: ob.arrivalTime},
    "return": ib?{departure:{local:ib.departureTime},arrival:{local:ib.arrivalTime}}:null,
    // everything except the final leg is a layover
    layovers: segs.slice(0,-1).map(function(s){return {city:s.toCity||s.to, code:s.to};}),
    durationInSeconds: ob.durationSeconds,
    totalDurationInSeconds: it.totalDurationSeconds,
    deepLink: it.bookingUrl,
    flyFrom: ob.from,
    flyTo: ob.to
  };
}
async function callFlights(dest,from,to,depTo){
  var args={flyFrom:'Tel Aviv',flyTo:dest,departureDate:dmy(from),returnDate:dmy(to),
    adults:S.adults,children:S.children,infants:0,sort:'price',currency:'USD'};
  // explicit [departureDate .. departureDateTo] range covers Sat night + Sun morning
  if(depTo&&depTo!==from)args.departureDateTo=dmy(depTo);
  var r=await window.cowork.callMcpTool('mcp__a7e92804-f66b-4b72-affb-e58df442b684__search-flight',args);
  var raw;
  try{raw=r.structuredContent||(r.content&&r.content[0]?JSON.parse(r.content[0].text):{});}catch(e){raw={};}
  var list = Array.isArray(raw) ? raw
           : (raw && Array.isArray(raw.itineraries) ? raw.itineraries : []);
  var all = list.map(normalizeItinerary).filter(function(f){return f.departure.local;});
  return{type:'flights',data:applyFilters(all)};
}
async function callHotels(dest,from,to){var rooms=S.adults<=2?1:2;var args={destination:dest,checkin_date:from,checkout_date:to,number_of_adults:S.adults,number_of_rooms:rooms,currency:'USD',user_country_code:'il',user_locale:'en',user_query:'good value hotels in '+dest};if(S.childAges.length>0)args.children_ages=S.childAges;var r=await window.cowork.callMcpTool('mcp__32f9c931-9eb0-4e61-9b31-470e653259fa__accommodations_search',args);var raw;try{raw=r.structuredContent||(r.content&&r.content[0]?JSON.parse(r.content[0].text):{});}catch(e){raw={};}var hotels=(raw&&raw.accommodations)?raw.accommodations.map(function(h){var rv=h.price&&h.price.book||0,cur=h.price&&h.price.currency||'USD';return Object.assign({},h,{priceUSD:cur==='ILS'?Math.round(rv/3.65):Math.round(rv)});}):[]; return{type:'hotels',data:hotels};}
function renderAll(){var d=S.last,n=nts(d.from,d.to),pax=totPax();document.getElementById('rtitle').textContent='Deals to '+d.dest;document.getElementById('rmeta').textContent=fdt(d.from)+' – '+fdt(d.to)+' · '+n+' nights · '+pax+' travellers · from TLV';document.getElementById('rcnt').textContent=(S.flights.length+S.hotels.length)+' results';document.getElementById('bFly').textContent=S.flights.length;document.getElementById('bHot').textContent=S.hotels.length;document.getElementById('tPkg').style.display=S.mode==='package'?'':'none';document.getElementById('tFly').style.display=S.mode!=='hotels'?'':'none';document.getElementById('tHot').style.display=S.mode!=='flights'?'':'none';renderFlights();renderHotels();renderPackages(n);if(S.mode==='flights')showTab('Fly');else if(S.mode==='hotels')showTab('Hot');else showTab('Pkg');document.getElementById('res').classList.add('vis');document.getElementById('res').scrollIntoView({behavior:'smooth',block:'start'});}

function renderFlights(){var box=document.getElementById('flyCards');var list=[].concat(S.flights).sort(function(a,b){if(S.fSort==='price')return a.price-b.price;return a.totalDurationInSeconds-b.totalDurationInSeconds;}).slice(0,15);if(!list.length){box.innerHTML='<div class="empty"><div class="ico">✈️</div><h3>No flights found</h3><p>Try wider dates or another destination.</p></div>';return;}box.innerHTML=list.map(function(f,i){var stops=getStops(f);var slout=stops===0?'Direct':stops===1?'via '+f.layovers[0].city:stops+' stops';var badge=i===0?'<div class="dbadge db-best">💰 Best Price</div>':stops===0?'<div class="dbadge db-dir">🎯 Direct</div>':'';return'<div class="fcard'+(i===0?' ftop':'')+'">'+badge+'<div class="seglbl">✈️ OUTBOUND · '+slout.toUpperCase()+'</div><div class="frow"><div class="fe"><div class="tm">'+ftm(f.departure&&f.departure.local)+'</div><div class="dt">'+fdt(f.departure&&f.departure.local)+'</div><div class="ap">TLV</div></div><div class="fmid"><div class="fdur">'+fdur(f.durationInSeconds)+'</div><div class="fpath"><div class="fline"></div>'+(stops>0?'<div class="fsdot"></div>':'<div class="farr">→</div>')+'<div class="fline"></div></div><div class="slbl '+(stops===0?'sdir':'sstop')+'">'+(stops===0?'✓ Direct':slout)+'</div></div><div class="fe"><div class="tm">'+ftm(f.arrival&&f.arrival.local)+'</div><div class="dt">'+fdt(f.arrival&&f.arrival.local)+'</div><div class="ap">'+f.flyTo+'</div></div></div><div class="cfoot"><div><div class="pbig">$'+f.price.toLocaleString()+'</div><span class="psub">'+totPax()+' pax · round trip</span></div><a class="bbtn" href="'+f.deepLink+'" target="_blank" rel="noopener">Book →</a></div></div>';}).join('');}
function sortHot(m,el){S.hSort=m;document.querySelectorAll('#pHot .sc').forEach(c=>c.classList.remove('on'));if(el)el.classList.add('on');renderHotels();}
function renderHotels(){var box=document.getElementById('hotCards');var n=nts(S.last&&S.last.from,S.last&&S.last.to);var list=[].concat(S.hotels).sort(function(a,b){if(S.hSort==='price')return(a.priceUSD||0)-(b.priceUSD||0);return(b.rating&&b.rating.review_score||0)-(a.rating&&a.rating.review_score||0);});if(!list.length){box.innerHTML='<div class="empty"><div class="ico">🏨</div><h3>No hotels found</h3><p>Try different dates or destination.</p></div>';return;}box.innerHTML=list.map(function(h){var kf=kfac(h.facilities||[]),pn=Math.round((h.priceUSD||0)/n),sc=h.rating&&h.rating.review_score||0,st=h.rating&&h.rating.stars||0;var loc=[h.location&&h.location.district_name,h.location&&h.location.city_name].filter(Boolean).join(', ');return'<div class="hcard"><div class="hhdr"><div><div class="hname">'+h.name+'</div><div class="hmeta"><span class="hstars">'+stars(st)+'</span><span class="rscore">'+sc.toFixed(1)+'</span><span class="rtxt">'+slbl(sc)+' · '+(h.rating&&h.rating.number_of_reviews||0).toLocaleString()+' reviews</span></div><div class="hloc">📍 '+loc+'</div></div><div class="hpblk"><div class="hprice">$'+(h.priceUSD||0).toLocaleString()+'</div><div class="hpsub">'+n+' nights total</div><div style="font-size:10px;color:#94a3b8;margin-top:1px;">≈ $'+pn+'/night</div><span class="srcpill sbk">booking.com</span></div></div>'+(kf.length?'<div class="facs">'+kf.map(function(f){return'<span class="ftag">'+f+'</span>';}).join('')+'</div>':'')+'<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;gap:8px;"><div style="font-size:11px;color:#64748b;">'+n+' nights</div><a class="bbtn" href="'+h.url+'" target="_blank" rel="noopener">Book →</a></div></div>';}).join('');}
function renderPackages(n){var box=document.getElementById('pkgCards');if(!S.flights.length||!S.hotels.length){box.innerHTML='<div class="empty"><div class="ico">📦</div><h3>No complete packages found</h3><p>Try a different destination or dates.</p></div>';document.getElementById('bPkg').textContent='0';return;}var tf=[].concat(S.flights).sort(function(a,b){return a.price-b.price;}).slice(0,3);var th=[].concat(S.hotels).sort(function(a,b){return(a.priceUSD||0)-(b.priceUSD||0);}).slice(0,4);var pkgs=[];tf.forEach(function(f){th.forEach(function(h){pkgs.push({f:f,h:h,tot:f.price+(h.priceUSD||0)});});});pkgs.sort(function(a,b){return a.tot-b.tot;});var show=pkgs.slice(0,6);document.getElementById('bPkg').textContent=show.length;box.innerHTML=show.map(function(pkg,i){var f=pkg.f,h=pkg.h,fst=getStops(f),pp=Math.round(pkg.tot/totPax()),nights=nts(S.last&&S.last.from,S.last&&S.last.to),lbl=i===0?'🏆 Best Deal':i===1?'⭐ Runner-Up':i===2?'💼 Great Value':'🔖 Good Pick';return'<div class="pkgcard'+(i===0?' ptop':'')+'"><div class="pkghdr"><div class="pkglbl">'+lbl+'</div><div><div class="pkgtot">$'+pkg.tot.toLocaleString()+'</div><span class="pkgtotsub">≈ $'+pp+'/person</span></div></div><div class="pkgitems"><div class="pkgitem"><div class="pkgicon">✈️</div><div class="pkginfo"><div class="pkgtitle">Flight · '+(fst===0?'Direct':fst+' stop'+(fst>1?'s':''))+'</div><div class="pkgdetail">'+fdt(f.departure&&f.departure.local)+' '+ftm(f.departure&&f.departure.local)+' TLV → '+ftm(f.arrival&&f.arrival.local)+' · '+fdur(f.durationInSeconds||0)+'</div></div><div class="pkgpcol"><div class="pkgprice">$'+f.price.toLocaleString()+'</div><a class="pkglink" href="'+f.deepLink+'" target="_blank" rel="noopener">Book →</a></div></div><div class="pkgitem"><div class="pkgicon">🏨</div><div class="pkginfo"><div class="pkgtitle">'+h.name+'</div><div class="pkgdetail"><span class="rscore">'+((h.rating&&h.rating.review_score)||0).toFixed(1)+'</span> '+slbl((h.rating&&h.rating.review_score)||0)+' · '+nights+' nights</div></div><div class="pkgpcol"><div class="pkgprice">$'+(h.priceUSD||0).toLocaleString()+'</div><a class="pkglink" href="'+h.url+'" target="_blank" rel="noopener">Book →</a></div></div></div><div class="pkgfoot">✅ '+nights+' nights · '+totPax()+' travellers · from $'+pkg.tot.toLocaleString()+'</div></div>';}).join('');}
