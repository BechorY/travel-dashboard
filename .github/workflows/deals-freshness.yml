name: Deals freshness

# Fails (and GitHub emails the repo owner) when the published data or index.html is invalid.
# No age check: deals are refreshed on demand (see refresh-deals.yml), so they may age between searches.
on:
  push:
    paths: ['deals.json', 'index.html', 'momondo.json', 'scripts/validate_deals.py', 'scripts/momondo_quotes.py']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate deals.json
        run: python3 scripts/validate_deals.py deals.json --allow-past
      - name: Validate momondo.json (if present)
        run: python3 scripts/momondo_quotes.py validate momondo.json
      - name: Guard - index.html must load deals.json (not the old embedded Cowork page)
        run: |
          grep -q "deals.json" index.html || { echo "index.html does not load deals.json - was it overwritten by the old Cowork artifact?"; exit 1; }
          ! grep -q "DAILY_DEALS_START" index.html || { echo "index.html contains embedded DAILY_DEALS (old Cowork version)"; exit 1; }
