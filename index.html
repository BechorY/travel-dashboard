// Season windows were hard-coded to fixed 2026 dates, so once a season passed

function isoDate(d){
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function addDays(iso,n){var d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return isoDate(d);}
function seasonWindow(s,today){
  var y=today.getFullYear();
  var w = s==='summer'
    ? {start:new Date(y,5,1),  end:new Date(y,7,31)}      // 1 Jun – 31 Aug
    : {start:new Date(y,10,1), end:new Date(y+1,0,31)};   // 1 Nov – 31 Jan
  if(w.end<today){                                        // window already closed → next year
    w = s==='summer'
      ? {start:new Date(y+1,5,1),  end:new Date(y+1,7,31)}
      : {start:new Date(y+1,10,1), end:new Date(y+2,0,31)};
  }
  return w;
}
function seasonDates(s){
  var today=new Date(); today.setHours(0,0,0,0);
  var w=seasonWindow(s,today);
  var d=new Date(w.start<today?today:w.start);
  while(d.getDay()!==0)d.setDate(d.getDate()+1);          // first Sunday in window
  if(d>w.end){d=new Date(w.start);while(d.getDay()!==0)d.setDate(d.getDate()+1);}
  var ret=new Date(d);ret.setDate(ret.getDate()+7);
  return {from:isoDate(d),to:isoDate(ret)};
}

async function doSearch(){
  var dest=document.getElementById('dest').value.trim(),from=document.getElementById('dateFrom').value,to=document.getElementById('dateTo').value,de=document.getElementById('dest');
  // Offline (GitHub Pages): filter the baked-in deals instead of calling MCP.
  if(!hasLiveBridge()){
    document.getElementById('ldwrap').classList.remove('vis');
    renderLocalResults(dest,localSearch(dest));
    return;
  }
  if(!dest){de.classList.add('err');de.focus();setTimeout(function(){de.classList.remove('err');},2500);return;}
  if(!from||!to){alert('Please choose departure and return dates.');return;}
  if(from>=to){alert('Return date must be after departure date.');return;}
  // Saturday-night departures belong to the same weekend as the Sunday, so when
  // that window is enabled we widen the API request back one day and let
  // applyFilters() decide. Without this the Saturday flights are never fetched.
  var wantSun=chk('chkSun',true), wantSat=chk('chkSat',false);
  var searchFrom=from, depTo=null;
  if(wantSun||wantSat){
    var sun=nextSundayInWindow(from);
    if(sun>to){alert('No Sunday found in date range.');return;}
    var sat=addDays(sun,-1);
    searchFrom = wantSat?sat:sun;
    depTo      = wantSun?sun:sat;
  }
  S.last={dest,from:searchFrom,to};S.flights=[];S.hotels=[];
  document.getElementById('res').classList.remove('vis');document.getElementById('ldwrap').classList.add('vis');document.getElementById('sbtn').disabled=true;
  setld('🔍 Searching '+dest+'…',fdt(searchFrom)+' – '+fdt(to)+' · '+totPax()+' travellers');
  try{
    var tasks=[];
    if(S.mode!=='hotels')tasks.push(callFlights(dest,searchFrom,to,depTo));
    if(S.mode!=='flights')tasks.push(callHotels(dest,searchFrom,to));
    var rs=await Promise.allSettled(tasks);
    rs.forEach(function(r){if(r.status==='fulfilled'&&r.value){if(r.value.type==='flights')S.flights=r.value.data;if(r.value.type==='hotels')S.hotels=r.value.data;}});
  }catch(e){console.error(e);}
  document.getElementById('ldwrap').classList.remove('vis');document.getElementById('sbtn').disabled=false;
  renderAll();
}
// Two accepted departure windows:
//   Sunday   04:00–08:00  (early-morning start to the week)
//   Saturday from 19:00   (Motzaei Shabbat — after Shabbat ends)
// A flight qualifies if it falls in EITHER enabled window. With both boxes
// unchecked there is no day/time restriction at all.
function val(id,dflt){var el=document.getElementById(id);return(el&&el.value)?el.value:dflt;}
function chk(id,dflt){var el=document.getElementById(id);return el?el.checked:dflt;}
function dayTimeOK(local){
  if(!local)return false;
  var dow=new Date(local.substring(0,10)+'T00:00:00').getDay(); // 0=Sun … 6=Sat
  var t=local.substring(11,16);
  var sunOn=chk('chkSun',true), satOn=chk('chkSat',false);
  if(!sunOn&&!satOn)return true;
  if(sunOn&&dow===0&&t>=val('tFrom','04:00')&&t<=val('tTo','08:00'))return true;
  if(satOn&&dow===6&&t>=val('satFrom','19:00'))return true;
  return false;
}
function applyFilters(list){
  return list.filter(function(f){
    var dep=f.departure&&f.departure.local?f.departure.local:'';
    if(!dayTimeOK(dep))return false;
    var ret=f['return']&&f['return'].arrival&&f['return'].arrival.local?f['return'].arrival.local.substring(0,10):'';
    return meetsMinDays(dep.substring(0,10),ret);

// The Kiwi tool returns {itineraries:[{price,outbound,inbound,bookingUrl,...}]}
// but the renderers below expect a flatter legacy shape (departure.local,
// layovers, deepLink, ...). Previously the code did Array.isArray(raw)?raw:[],
// which is always false for that object — so every search silently produced
// zero flights. Normalise here so the consumers keep working unchanged.
function normalizeItinerary(it){
  var ob=it.outbound||{}, ib=it.inbound||null, segs=ob.segments||[];
  return {
    price: it.price,
    priceFormatted: it.priceFormatted,
    departure:{local: ob.departureTime},
    arrival:{local: ob.arrivalTime},
    "return": ib?{departure:{local:ib.departureTime},arrival:{local:ib.arrivalTime}}:null,
    // everything except the final leg is a layover
    layovers: segs.slice(0,-1).map(function(s){return {city:s.toCity||s.to, code:s.to};}),
    durationInSeconds: ob.durationSeconds,
    totalDurationInSeconds: it.totalDurationSeconds,
    deepLink: it.bookingUrl,
    flyFrom: ob.from,
    flyTo: ob.to

    adults:S.adults,children:S.children,infants:0,sort:'price',currency:'USD'};
  // explicit [departureDate .. departureDateTo] range covers Sat night + Sun morning
  if(depTo&&depTo!==from)args.departureDateTo=dmy(depTo);
  var r=await window.cowork.callMcpTool('mcp__a7e92804-f66b-4b72-affb-e58df442b684__search-flight',args);
  var raw;
  try{raw=r.structuredContent||(r.content&&r.content[0]?JSON.parse(r.content[0].text):{});}catch(e){raw={};}
  var list = Array.isArray(raw) ? raw
           : (raw && Array.isArray(raw.itineraries) ? raw.itineraries : []);
  var all = list.map(normalizeItinerary).filter(function(f){return f.departure.local;});
  return{type:'flights',data:applyFilters(all)};
}
async function callHotels(dest,from,to){var rooms=S.adults<=2?1:2;var args={destination:dest,checkin_date:from,checkout_date:to,number_of_adults:S.adults,number_of_rooms:rooms,currency:'USD',user_country_code:'il',user_locale:'en',user_query:'good value hotels in '+dest};if(S.childAges.length>0)args.children_ages=S.childAges;var r=await window.cowork.callMcpTool('mcp__32f9c931-9eb0-4e61-9b31-470e653259fa__accommodations_search',args);var raw;try{raw=r.structuredContent||(r.content&&r.content[0]?JSON.parse(r.content[0].text):{});}catch(e){raw={};}var hotels=(raw&&raw.accommodations)?raw.accommodations.map(function(h){var rv=h.price&&h.price.book||0,cur=h.price&&h.price.currency||'USD';return Object.assign({},h,{priceUSD:cur==='ILS'?Math.round(rv/3.65):Math.round(rv)});}):[]; return{type:'hotels',data:hotels};}
function renderAll(){var d=S.last,n=nts(d.from,d.to),pax=totPax();document.getElementById('rtitle').textContent='Deals to '+d.dest;document.getElementById('rmeta').textContent=fdt(d.from)+' – '+fdt(d.to)+' · '+n+' nights · '+pax+' travellers · from TLV';document.getElementById('rcnt').textContent=(S.flights.length+S.hotels.length)+' results';document.getElementById('bFly').textContent=S.flights.length;document.getElementById('bHot').textContent=S.hotels.length;document.getElementById('tPkg').style.display=S.mode==='package'?'':'none';document.getElementById('tFly').style.display=S.mode!=='hotels'?'':'none';document.getElementById('tHot').style.display=S.mode!=='flights'?'':'none';renderFlights();renderHotels();renderPackages(n);if(S.mode==='flights')showTab('Fly');else if(S.mode==='hotels')showTab('Hot');else showTab('Pkg');document.getElementById('res').classList.add('vis');document.getElementById('res').scrollIntoView({behavior:'smooth',block:'start'});}
function sortFly(m,el){S.fSort=m;document.querySelectorAll('#pFly .sc').forEach(c=>c.classList.remove('on'));if(el)el.classList.add('on');renderFlights();}
function renderFlights(){var box=document.getElementById('flyCards');var list=[].concat(S.flights).sort(function(a,b){if(S.fSort==='price')return a.price-b.price;return a.totalDurationInSeconds-b.totalDurationInSeconds;}).slice(0,15);if(!list.length){box.innerHTML='<div class="empty"><div class="ico">✈️</div><h3>No flights found</h3><p>Try wider dates or another destination.</p></div>';return;}box.innerHTML=list.map(function(f,i){var stops=getStops(f);var slout=stops===0?'Direct':stops===1?'via '+f.layovers[0].city:stops+' stops';var badge=i===0?'<div class="dbadge db-best">💰 Best Price</div>':stops===0?'<div class="dbadge db-dir">🎯 Direct</div>':'';return'<div class="fcard'+(i===0?' ftop':'')+'">'+badge+'<div class="seglbl">✈️ OUTBOUND · '+slout.toUpperCase()+'</div><div class="frow"><div class="fe"><div class="tm">'+ftm(f.departure&&f.departure.local)+'</div><div class="dt">'+fdt(f.departure&&f.departure.local)+'</div><div class="ap">TLV</div></div><div class="fmid"><div class="fdur">'+fdur(f.durationInSeconds)+'</div><div class="fpath"><div class="fline"></div>'+(stops>0?'<div class="fsdot"></div>':'<div class="farr">→</div>')+'<div class="fline"></div></div><div class="slbl '+(stops===0?'sdir':'sstop')+'">'+(stops===0?'✓ Direct':slout)+'</div></div><div class="fe"><div class="tm">'+ftm(f.arrival&&f.arrival.local)+'</div><div class="dt">'+fdt(f.arrival&&f.arrival.local)+'</div><div class="ap">'+f.flyTo+'</div></div></div><div class="cfoot"><div><div class="pbig">$'+f.price.toLocaleString()+'</div><span class="psub">'+totPax()+' pax · round trip</span></div><a class="bbtn" href="'+f.deepLink+'" target="_blank" rel="noopener">Book →</a></div></div>';}).join('');}
function sortHot(m,el){S.hSort=m;document.querySelectorAll('#pHot .sc').forEach(c=>c.classList.remove('on'));if(el)el.classList.add('on');renderHotels();}
function renderHotels(){var box=document.getElementById('hotCards');var n=nts(S.last&&S.last.from,S.last&&S.last.to);var list=[].concat(S.hotels).sort(function(a,b){if(S.hSort==='price')return(a.priceUSD||0)-(b.priceUSD||0);return(b.rating&&b.rating.review_score||0)-(a.rating&&a.rating.review_score||0);});if(!list.length){box.innerHTML='<div class="empty"><div class="ico">🏨</div><h3>No hotels found</h3><p>Try different dates or destination.</p></div>';return;}box.innerHTML=list.map(function(h){var kf=kfac(h.facilities||[]),pn=Math.round((h.priceUSD||0)/n),sc=h.rating&&h.rating.review_score||0,st=h.rating&&h.rating.stars||0;var loc=[h.location&&h.location.district_name,h.location&&h.location.city_name].filter(Boolean).join(', ');return'<div class="hcard"><div class="hhdr"><div><div class="hname">'+h.name+'</div><div class="hmeta"><span class="hstars">'+stars(st)+'</span><span class="rscore">'+sc.toFixed(1)+'</span><span class="rtxt">'+slbl(sc)+' · '+(h.rating&&h.rating.number_of_reviews||0).toLocaleString()+' reviews</span></div><div class="hloc">📍 '+loc+'</div></div><div class="hpblk"><div class="hprice">$'+(h.priceUSD||0).toLocaleString()+'</div><div class="hpsub">'+n+' nights total</div><div style="font-size:10px;color:#94a3b8;margin-top:1px;">≈ $'+pn+'/night</div><span class="srcpill sbk">booking.com</span></div></div>'+(kf.length?'<div class="facs">'+kf.map(function(f){return'<span class="ftag">'+f+'</span>';}).join('')+'</div>':'')+'<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;gap:8px;"><div style="font-size:11px;color:#64748b;">'+n+' nights</div><a class="bbtn" href="'+h.url+'" target="_blank" rel="noopener">Book →</a></div></div>';}).join('');}
function renderPackages(n){var box=document.getElementById('pkgCards');if(!S.flights.length||!S.hotels.length){box.innerHTML='<div class="empty"><div class="ico">📦</div><h3>No complete packages found</h3><p>Try a different destination or dates.</p></div>';document.getElementById('bPkg').textContent='0';return;}var tf=[].concat(S.flights).sort(function(a,b){return a.price-b.price;}).slice(0,3);var th=[].concat(S.hotels).sort(function(a,b){return(a.priceUSD||0)-(b.priceUSD||0);}).slice(0,4);var pkgs=[];tf.forEach(function(f){th.forEach(function(h){pkgs.push({f:f,h:h,tot:f.price+(h.priceUSD||0)});});});pkgs.sort(function(a,b){return a.tot-b.tot;});var show=pkgs.slice(0,6);document.getElementById('bPkg').textContent=show.length;box.innerHTML=show.map(function(pkg,i){var f=pkg.f,h=pkg.h,fst=getStops(f),pp=Math.round(pkg.tot/totPax()),nights=nts(S.last&&S.last.from,S.last&&S.last.to),lbl=i===0?'🏆 Best Deal':i===1?'⭐ Runner-Up':i===2?'💼 Great Value':'🔖 Good Pick';return'<div class="pkgcard'+(i===0?' ptop':'')+'"><div class="pkghdr"><div class="pkglbl">'+lbl+'</div><div><div class="pkgtot">$'+pkg.tot.toLocaleString()+'</div><span class="pkgtotsub">≈ $'+pp+'/person</span></div></div><div class="pkgitems"><div class="pkgitem"><div class="pkgicon">✈️</div><div class="pkginfo"><div class="pkgtitle">Flight · '+(fst===0?'Direct':fst+' stop'+(fst>1?'s':''))+'</div><div class="pkgdetail">'+fdt(f.departure&&f.departure.local)+' '+ftm(f.departure&&f.departure.local)+' TLV → '+ftm(f.arrival&&f.arrival.local)+' · '+fdur(f.durationInSeconds||0)+'</div></div><div class="pkgpcol"><div class="pkgprice">$'+f.price.toLocaleString()+'</div><a class="pkglink" href="'+f.deepLink+'" target="_blank" rel="noopener">Book →</a></div></div><div class="pkgitem"><div class="pkgicon">🏨</div><div class="pkginfo"><div class="pkgtitle">'+h.name+'</div><div class="pkgdetail"><span class="rscore">'+((h.rating&&h.rating.review_score)||0).toFixed(1)+'</span> '+slbl((h.rating&&h.rating.review_score)||0)+' · '+nights+' nights</div></div><div class="pkgpcol"><div class="pkgprice">$'+(h.priceUSD||0).toLocaleString()+'</div><a class="pkglink" href="'+h.url+'" target="_blank" rel="noopener">Book →</a></div></div></div><div class="pkgfoot">✅ '+nights+' nights · '+totPax()+' travellers · from $'+pkg.tot.toLocaleString()+'</div></div>';}).join('');}

window.onerror=function(msg,src,line,col,err){var u=document.getElementById('updAt');var d=document.getElementById('statusDot');if(u){u.textContent='JS error: '+msg+' (line '+line+')';}if(d){d.className='status-dot stale';}return false;};
try{setSeason(DAILY_DEALS&&DAILY_DEALS.season==='winter'?'winter':'summer');}catch(e){var _u=document.getElementById('updAt');if(_u)_u.textContent='Init error: '+e.message;}

// Adapt the search panel to whichever environment we're running in.
try{
  if(!hasLiveBridge()){
    var sb=document.getElementById('sbtn');
    if(sb)sb.innerHTML='🔍 Search Deals';
    var dsp=document.getElementById('dest');
    if(dsp)dsp.placeholder='Filter by destination… (leave blank for all)';
    // Date + passenger controls don't apply to pre-loaded deals — hide them
    // rather than leave inputs that silently do nothing.
    ['dateFrom','dateTo'].forEach(function(id){
      var el=document.getElementById(id);
      if(el&&el.parentElement)el.parentElement.style.display='none';
    });
    var flt=document.querySelector('.filters');
    if(flt)flt.style.display='none';
    var panel=document.getElementById('spanelBody');
    if(panel){
      var note=document.createElement('div');
      note.style.cssText='margin-top:10px;padding:9px 11px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;font-size:11px;color:#1e40af;line-height:1.5';
      note.innerHTML='ℹ️ Showing the destinations from today’s 10:00 search. '
        +'Live search over any date needs the Claude app — this public page has no API access.';
      panel.appendChild(note);
    }
  }
}catch(e){console.warn('offline-mode setup failed',e);}
